<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 1">
  <title>OffRent Ledger — App Store template 1 — hero</title>
  <defs>
    <filter id="phoneShadow" x="-40%" y="-25%" width="180%" height="160%">
      <feDropShadow dx="0" dy="46" stdDeviation="52" flood-color="#5A4F3C" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B342A" flood-opacity="0.20"/>
    </filter>
    <filter id="phoneShadowDark" x="-40%" y="-25%" width="180%" height="160%">
      <feDropShadow dx="0" dy="52" stdDeviation="58" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <radialGradient id="warmGlow" cx="50%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="50%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#FF8A1F" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="#F6F1E8"/>
  <rect width="1290" height="2796" fill="url(#warmGlow)"/>
  <rect x="0" y="2176" width="1290" height="620" fill="#E9E5DC" opacity="0.55"/>
  <g class="motif-meter">
    <circle cx="1110.0" cy="246.0" r="76.0" fill="none" stroke="#DDD5C6" stroke-width="16.0"/>
    <path d="M 1110.00 170.00 A 76.0 76.0 0 1 1 1054.60 298.03"
          fill="none" stroke="#FF8A1F" stroke-width="16.0" stroke-linecap="round"/>
  </g>
  <g class="device">
    <rect x="230.66" y="987.00" width="828.67" height="1739.28"
          rx="116.38" fill="#20242B" filter="url(#phoneShadow)"/>
    <rect x="232.16" y="988.50"
          width="825.67" height="1736.28"
          rx="114.88" fill="none" stroke="#4A525F" stroke-width="3"/>
    <rect class="screen-area" x="255.00" y="1011.34"
          width="780.00" height="1690.60"
          rx="92.04" fill="#D8D2C7"/>
    <rect x="531.63" y="1031.20" width="226.75" height="66.50"
          rx="33.25" fill="#0B0E12"/>
  </g>
  <text x="645.0" y="470.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="middle" letter-spacing="-2.46" xml:space="preserve"><tspan x="645.0" dy="0.0">Stop the rental clock</tspan><tspan x="645.0" dy="118.7">with proof.</tspan></text>
  <text x="645.0" y="737.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#5B6068" text-anchor="middle" letter-spacing="-0.21" xml:space="preserve"><tspan x="645.0" dy="0.0">Track costs, confirmations, pickup,</tspan><tspan x="645.0" dy="70.7">and final charges.</tspan></text>
</svg>
