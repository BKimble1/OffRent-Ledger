<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 1">
  <title>OffRent Ledger — App Store template 1 — hero</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="graphiteRise" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0%" stop-color="#252A31"/>
      <stop offset="62%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#171A1F"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="url(#heroFade)"/>
  <rect width="1290" height="2796" fill="url(#warmGlow)"/>
  <ellipse cx="645" cy="2852" rx="1109" ry="839" fill="#E9E5DC" opacity="0.55"/>
  <g class="motif-meter">
    <circle cx="1108.0" cy="226.0" r="78.0" fill="none" stroke="#DFD9CC" stroke-width="16.0"/>
    <path d="M 1108.00 148.00 A 78.0 78.0 0 1 1 1051.14 279.39"
          fill="none" stroke="#FF8A1F" stroke-width="16.0" stroke-linecap="round"/>
    <line x1="1108.0" y1="226.0" x2="1073.88" y2="258.04"
          stroke="#171A1F" stroke-width="9.9" stroke-linecap="round"/>
    <circle cx="1108.0" cy="226.0" r="8.3" fill="#171A1F"/>
  </g>
  <g class="device-shadow"><ellipse cx="645.0" cy="1967.2" rx="704.4" ry="1061.4" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="645.0" cy="2759.5" rx="424.4" ry="75.8" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device">
    <rect x="193.48" y="830.00" width="903.04" height="1895.37"
          rx="126.82" fill="#1E1D1B"/>
    <rect x="194.98" y="831.50"
          width="900.04" height="1892.37"
          rx="125.32" fill="none" stroke="#52504A" stroke-width="3"/>
    <rect class="screen-area" id="screen-1" x="220.00" y="856.52"
          width="850.00" height="1842.33"
          rx="100.30" fill="#D8D2C7"/>
    <rect x="521.45" y="878.17" width="247.09" height="72.47"
          rx="36.24" fill="#0B0E12"/>
  </g>
  <text x="645.0" y="452.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="middle" letter-spacing="-2.46" xml:space="preserve"><tspan x="645.0" dy="0.0">Stop the rental clock</tspan><tspan x="645.0" dy="118.7">with proof.</tspan></text>
  <text x="645.0" y="719.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="middle" letter-spacing="-0.21" xml:space="preserve"><tspan x="645.0" dy="0.0">Running cost, urgent calls, and</tspan><tspan x="645.0" dy="70.7">every jobsite in one place.</tspan></text>
</svg>
