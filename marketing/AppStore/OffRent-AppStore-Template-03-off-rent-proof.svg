<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 3">
  <title>OffRent Ledger — App Store template 3 — off-rent-proof</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="graphiteRise" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0%" stop-color="#252A31"/>
      <stop offset="62%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#171A1F"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="#F6F1E8"/>
  <rect x="0" y="0" width="1290" height="1692" fill="#E9E5DC"/>
  <rect x="0" y="1690" width="1290" height="150" fill="url(#divisionFade)"/>
  <rect width="1290" height="2796" fill="url(#warmGlow)" opacity="0.45"/>
  <g class="motif-stop">
    <rect x="104.0" y="2101.0" width="1042.0" height="46.0" rx="23.0"
          fill="none" stroke="#ADA391" stroke-width="7.0"/>
    <rect x="104.0" y="2101.0" width="646.0" height="46.0" rx="23.0" fill="#FF8A1F"/>
    <rect x="742.7" y="2072.5" width="14.7"
          height="103.0" rx="7.4" fill="#ADA391"/>
  </g>
  <g class="device-shadow"><ellipse cx="583.0" cy="1265.1" rx="679.5" ry="1023.9" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="583.0" cy="2029.4" rx="409.4" ry="73.1" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device">
    <rect x="147.42" y="168.00" width="871.17" height="1828.47"
          rx="122.34" fill="#1E1D1B"/>
    <rect x="148.92" y="169.50"
          width="868.17" height="1825.47"
          rx="120.84" fill="none" stroke="#52504A" stroke-width="3"/>
    <rect class="screen-area" id="screen-1" x="173.00" y="193.58"
          width="820.00" height="1777.30"
          rx="96.76" fill="#D8D2C7"/>
    <rect x="463.81" y="214.47" width="238.37" height="69.92"
          rx="34.96" fill="#0B0E12"/>
  </g>
  <text x="104.0" y="2300.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="start" letter-spacing="-2.46" xml:space="preserve"><tspan x="104.0" dy="0.0">Record</tspan><tspan x="104.0" dy="118.7">off-rent proof.</tspan></text>
  <text x="104.0" y="2567.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="start" letter-spacing="-0.21" xml:space="preserve"><tspan x="104.0" dy="0.0">Confirmation number, meter, fuel,</tspan><tspan x="104.0" dy="70.7">and condition, kept together.</tspan></text>
</svg>
