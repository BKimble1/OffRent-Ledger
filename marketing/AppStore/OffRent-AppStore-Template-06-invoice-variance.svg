<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 6">
  <title>OffRent Ledger — App Store template 6 — invoice-variance</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="url(#graphiteFade)"/>
  <ellipse cx="955" cy="363" rx="851" ry="615" fill="url(#neutralLift)"/>
  <g class="motif-variance">
    <rect x="104.0" y="1000.0" width="558.0" height="46.0" rx="23.0" fill="#867F72"/>
    <rect x="104.0" y="1076.0" width="827.3" height="46.0" rx="23.0" fill="#867F72"/>
    <rect x="662.0" y="1076.0" width="269.4" height="46.0"
          rx="23.0" fill="#FF8A1F"/>
    <line x1="662.0" y1="977.0" x2="662.0"
          y2="1145.0" stroke="#FF8A1F" stroke-width="4"
          stroke-dasharray="14 12" stroke-linecap="round"/>
  </g>
  <g class="device-shadow"><ellipse cx="487.0" cy="2201.6" rx="592.5" ry="892.8" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="487.0" cy="2868.0" rx="357.0" ry="63.8" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device">
    <rect x="107.19" y="1245.00" width="759.62" height="1594.34"
          rx="106.68" fill="#0E1116"/>
    <rect x="108.69" y="1246.50"
          width="756.62" height="1591.34"
          rx="105.18" fill="none" stroke="#4C4840" stroke-width="3"/>
    <rect class="screen-area" x="129.50" y="1267.31"
          width="715.00" height="1549.72"
          rx="84.37" fill="#4A4A48"/>
    <rect x="383.07" y="1285.52" width="207.85" height="60.96"
          rx="30.48" fill="#0B0E12"/>
  </g>
  <text x="104.0" y="440.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#F6F1E8" text-anchor="start" letter-spacing="-2.46" xml:space="preserve"><tspan x="104.0" dy="0.0">Spot possible billing</tspan><tspan x="104.0" dy="118.7">differences.</tspan></text>
  <text x="104.0" y="707.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#DAD4C7" text-anchor="start" letter-spacing="-0.21" xml:space="preserve"><tspan x="104.0" dy="0.0">Compare expected cost with</tspan><tspan x="104.0" dy="70.7">the vendor invoice.</tspan></text>
</svg>
