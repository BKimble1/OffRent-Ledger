<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 5">
  <title>OffRent Ledger — App Store template 5 — scan-review</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="graphiteRise" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0%" stop-color="#252A31"/>
      <stop offset="62%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#171A1F"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="#F6F1E8"/>
  <path d="M 0 881 L 1290 685 L 1290 2796 L 0 2796 Z" fill="#E9E5DC" opacity="0.40"/>
  <rect x="74" y="753" width="1142" height="2061" rx="56" fill="#E9E5DC" opacity="0.66" transform="rotate(-3.000 645.0 1783.4)"/>
  <rect width="1290" height="2796" fill="url(#warmGlow)" opacity="0.55"/>
  <g class="motif-scan"><path d="M 1018 168.96 L 1018 132 L 1054.96 132" fill="none" stroke="#FF8A1F" stroke-width="8" stroke-linecap="square"/><path d="M 1149.04 132 L 1186 132 L 1186 168.96" fill="none" stroke="#B4AB99" stroke-width="8" stroke-linecap="square"/><path d="M 1186 263.04 L 1186 300 L 1149.04 300" fill="none" stroke="#FF8A1F" stroke-width="8" stroke-linecap="square"/><path d="M 1054.96 300 L 1018 300 L 1018 263.04" fill="none" stroke="#B4AB99" stroke-width="8" stroke-linecap="square"/></g>
  <g class="device-shadow" transform="rotate(-3.000 645.00 1783.38)"><ellipse cx="645.0" cy="1968.5" rx="687.8" ry="1036.4" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="645.0" cy="2742.1" rx="414.4" ry="74.0" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device" transform="rotate(-3.000 645.00 1783.38)">
    <rect x="204.10" y="858.00" width="881.79" height="1850.77"
          rx="123.84" fill="#1E1D1B"/>
    <rect x="205.60" y="859.50"
          width="878.79" height="1847.77"
          rx="122.34" fill="none" stroke="#52504A" stroke-width="3"/>
    <rect class="screen-area" id="screen-1" x="230.00" y="883.90"
          width="830.00" height="1798.98"
          rx="97.94" fill="#D8D2C7"/>
    <rect x="524.36" y="905.03" width="241.28" height="70.77"
          rx="35.38" fill="#0B0E12"/>
  </g>
  <text x="104.0" y="420.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="start" letter-spacing="-2.46" xml:space="preserve"><tspan x="104.0" dy="0.0">Scan the contract.</tspan><tspan x="104.0" dy="118.7">Review every field.</tspan></text>
  <text x="104.0" y="687.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="start" letter-spacing="-0.21" xml:space="preserve"><tspan x="104.0" dy="0.0">Every value is yours to check</tspan><tspan x="104.0" dy="70.7">before anything is saved.</tspan></text>
</svg>
