# OffRent Ledger — verification.
#
# Every push and pull request. Repository invariants, portable domain tests, a simulator build of
# the app and its widget, and the unit tests. Signs nothing and publishes nothing.
#
# Ported from `codemagic.yaml`, which this replaces. The shared shell still lives in `scripts/ci/`
# rather than inline: a discovery snippet with an embedded interpreter inside a YAML block scalar
# is a quoting trap, and a file can be run and linted.

name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_SCHEME: OffRentLedger
  XCODE_PROJECT: OffRentLedger.xcodeproj

jobs:
  verify:
    name: Build and test
    # `macos-latest` rather than a pinned image label: the labels change, and a label the
    # account does not have is a job that never starts. Pin one here if you need a specific
    # Xcode that only a newer image carries.
    runs-on: macos-latest
    # 75, not 45. A failing UI test gives up after eight seconds; a passing one drives the whole
    # workflow — mark done, contact vendor, confirmation, pickup, invoice, accept, relaunch — and
    # takes a minute or more. So the suite got *slower* as it got greener, and 45 minutes was
    # sized against a run where thirteen tests bailed early. A job killed at the cap reports
    # nothing at all, which is the most expensive way to learn anything here.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Not a hardcoded path. Runner images gain and lose Xcode versions, and a missing
        # `/Applications/Xcode_<version>.app` fails the job on the first line with an error about
        # a directory rather than about the build.
        run: |
          set -e
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -switch "$NEWEST"
          fi
          echo "Using $(xcode-select -p)"
          xcodebuild -version

      - name: Install Python dependencies
        # `--break-system-packages` is needed on a PEP 668 Python and rejected by older pips, so
        # try it only if the plain install refuses.
        run: |
          python3 -m pip install --quiet pillow pyyaml \
            || python3 -m pip install --quiet --break-system-packages pillow pyyaml

      - name: Repository invariants
        run: python3 scripts/verify_repository.py

      # The portable layer carries the money, the dates, the state machine and the parsers, and it
      # needs no simulator. It runs before anything slow so a broken rate engine fails in thirty
      # seconds rather than in twenty minutes.
      - name: Portable domain tests
        run: |
          set -o pipefail
          swift test --package-path . 2>&1 | tee swift-test.log

      - name: Generated artefacts are current
        run: |
          python3 scripts/generate_xcodeproj.py --check
          python3 scripts/generate_assets.py --check
          python3 scripts/prepare_app_icon.py --check
          python3 scripts/prepare_launch_assets.py --check
          swift run --package-path . offrent-docgen . --check

      - name: Show the project Xcode sees
        run: xcodebuild -list -project "$XCODE_PROJECT"

      # Building the app scheme also builds the widget: the app depends on it and embeds the
      # .appex, so a widget compile error fails this step.
      - name: Build app and widget for the simulator
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log || STATUS=$?
          # Summarise on failure too. Without this a failed build ends with pages of clang
          # invocations and the `error:` lines are thousands of lines up, out of view — which is
          # exactly what happened on the first two runs of the Codemagic version.
          bash scripts/ci/summarize_test_log.sh xcodebuild.log
          exit $STATUS

      - name: Unit tests
        run: |
          set -o pipefail
          STATUS=0
          # `generic/platform=iOS Simulator` is a build-only destination and cannot run a bundle.
          DEVICE_ID=$(bash scripts/ci/find_simulator.sh)
          echo "Running on simulator $DEVICE_ID"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:OffRentLedgerTests \
            -resultBundlePath OffRentLedgerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-tests.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh xcodebuild-tests.log
          exit $STATUS

      # The app's first actual launch. Separate from the unit tests so that a UI failure is
      # legible as one, and named per class so a slow scenario added later cannot silently turn
      # this into something nobody wants to wait for.
      #
      # `AppStoreCaptureUITests` is in this list for a different reason from the rest. It asserts
      # almost nothing — it walks to the six screens the App Store gallery is built from and
      # photographs each one. Running it on every push is what stops the capture path rotting
      # between the releases that need it, and the screenshots it attaches to the result bundle
      # are pulled out by `scripts/capture_appstore_screenshots.sh` when somebody wants them.
      - name: UI tests
        run: |
          set -o pipefail
          STATUS=0
          DEVICE_ID=$(bash scripts/ci/find_simulator.sh)
          echo "Running UI tests on simulator $DEVICE_ID"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:OffRentLedgerUITests/CoreWorkflowUITests \
            -only-testing:OffRentLedgerUITests/MismatchUITests \
            -only-testing:OffRentLedgerUITests/EntitlementUITests \
            -only-testing:OffRentLedgerUITests/AccessibilityUITests \
            -only-testing:OffRentLedgerUITests/OnboardingUITests \
            -only-testing:OffRentLedgerUITests/ReusableRecordsUITests \
            -only-testing:OffRentLedgerUITests/MapAndEditingUITests \
            -only-testing:OffRentLedgerUITests/LayoutObstructionUITests \
            -only-testing:OffRentLedgerUITests/InvoiceAcceptanceUITests \
            -only-testing:OffRentLedgerUITests/AppStoreCaptureUITests \
            -resultBundlePath OffRentLedgerUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-uitests.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh xcodebuild-uitests.log
          exit $STATUS

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            *.log
            OffRentLedgerTests.xcresult
            OffRentLedgerUITests.xcresult
          retention-days: 14
          if-no-files-found: ignore

  # iPad is a separate job rather than another step, for two reasons. It runs at the same time as
  # the iPhone suite instead of adding a quarter of an hour to a job that is already long, and a
  # failure here is legible as "iPad" in the checks list rather than as the ninth `-only-testing`
  # on a step called "UI tests".
  #
  # The app ships as a universal binary (`OFFRENT_DEVICE_FAMILY = 1,2`), so this is not optional
  # polish: `IPadLayoutUITests` is the only test in the repository that can see that setting, and
  # an iPhone-only binary running letterboxed on an iPad fails its first assertion.
  ipad:
    name: iPad
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -e
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -switch "$NEWEST"
          fi
          echo "Using $(xcode-select -p)"

      - name: Build app and widget for the simulator
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-ipad.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh xcodebuild-ipad.log
          exit $STATUS

      # The layout suite plus the whole core workflow. The layout suite proves the window, the
      # orientations and the readable column; the workflow suite proves a contractor can actually
      # get from an empty app to an accepted invoice on an iPad, which is the part a screenshot
      # of a nicely centred column would not tell anybody.
      - name: UI tests on an iPad
        run: |
          set -o pipefail
          STATUS=0
          DEVICE_ID=$(bash scripts/ci/find_simulator.sh iPad)
          echo "Running iPad UI tests on simulator $DEVICE_ID"
          # Name the model in the log. "id=UUID" in a failure message names nothing.
          xcrun simctl list devices available | grep "$DEVICE_ID" || true
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" \
            -only-testing:OffRentLedgerUITests/IPadLayoutUITests \
            -only-testing:OffRentLedgerUITests/CoreWorkflowUITests \
            -resultBundlePath OffRentLedgerIPadUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-ipad-uitests.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh xcodebuild-ipad-uitests.log
          exit $STATUS

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-logs
          path: |
            *.log
            OffRentLedgerIPadUITests.xcresult
          retention-days: 14
          if-no-files-found: ignore
