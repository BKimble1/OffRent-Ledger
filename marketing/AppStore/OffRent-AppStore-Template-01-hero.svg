  <text x="645.0" y="470.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="middle" letter-spacing="-2.46" xml:space="preserve"><tspan x="645.0" dy="0.0">Stop the rental clock</tspan><tspan x="645.0" dy="118.7">with proof.</tspan></text>
  <text x="645.0" y="737.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="middle" letter-spacing="-0.21" xml:space="preserve"><tspan x="645.0" dy="0.0">Track costs, confirmations, pickup,</tspan><tspan x="645.0" dy="70.7">and final charges.</tspan></text>
