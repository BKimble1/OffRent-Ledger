<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 2">
  <title>OffRent Ledger — App Store template 2 — active-costs</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="#DED7C8"/>
  <rect width="1290" height="2796" fill="url(#topLift)"/>
  <rect x="0" y="1118" width="1290" height="1678" fill="#D7CEBD" opacity="0.50"/>
  <g class="motif-progression"><rect x="104.0" y="1144.0" width="26.0" height="54.0" rx="13.0" fill="#BFB7A6"/><rect x="152.0" y="1114.0" width="26.0" height="84.0" rx="13.0" fill="#BFB7A6"/><rect x="200.0" y="1084.0" width="26.0" height="114.0" rx="13.0" fill="#BFB7A6"/><rect x="248.0" y="1054.0" width="26.0" height="144.0" rx="13.0" fill="#BFB7A6"/><rect x="296.0" y="1024.0" width="26.0" height="174.0" rx="13.0" fill="#BFB7A6"/><rect x="344.0" y="994.0" width="26.0" height="204.0" rx="13.0" fill="#BFB7A6"/><rect x="392.0" y="964.0" width="26.0" height="234.0" rx="13.0" fill="#BFB7A6"/><rect x="440.0" y="934.0" width="26.0" height="264.0" rx="13.0" fill="#FF8A1F"/><rect x="488.0" y="904.0" width="26.0" height="294.0" rx="13.0" fill="#FF8A1F"/></g>
  <g class="device-shadow"><ellipse cx="863.0" cy="2182.5" rx="580.1" ry="874.1" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="863.0" cy="2835.0" rx="349.5" ry="62.4" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device">
    <rect x="491.16" y="1246.00" width="743.68" height="1560.89"
          rx="104.44" fill="#1E1D1B"/>
    <rect x="492.66" y="1247.50"
          width="740.68" height="1557.89"
          rx="102.94" fill="none" stroke="#52504A" stroke-width="3"/>
    <rect class="screen-area" x="513.00" y="1267.84"
          width="700.00" height="1517.21"
          rx="82.60" fill="#D8D2C7"/>
    <rect x="761.25" y="1285.67" width="203.49" height="59.68"
          rx="29.84" fill="#0B0E12"/>
  </g>
  <text x="104.0" y="440.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="start" letter-spacing="-2.46" xml:space="preserve"><tspan x="104.0" dy="0.0">Control every</tspan><tspan x="104.0" dy="118.7">active rental.</tspan></text>
  <text x="104.0" y="707.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="start" letter-spacing="-0.21" xml:space="preserve"><tspan x="104.0" dy="0.0">See running costs and</tspan><tspan x="104.0" dy="70.7">upcoming rate changes.</tspan></text>
</svg>
