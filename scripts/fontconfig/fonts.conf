<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Grayscale antialiasing, forced.

  Cairo's default on many Linux hosts is subpixel (LCD) antialiasing, which renders text with
  red and blue fringes on opposite edges of every stem. On a screen that is invisible; in a PNG
  uploaded to the App Store it is coloured noise around the headline, and the first build here
  had bright blue pixels (#3A84CA, #4892D6) sitting inside otherwise graphite type.

  This file is pointed at by FONTCONFIG_FILE from generate_appstore_templates.py, so the render
  does not depend on how the host machine happens to be configured.
-->
<fontconfig>
  <dir>/usr/local/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
