      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="58%" stop-color="#1E2025"/>
      <stop offset="100%" stop-color="#2A2B2E"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
