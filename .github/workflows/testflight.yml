# OffRent Ledger — TestFlight.
#
# The only workflow that signs anything or sends anything to Apple. Manual, never on a push.
#
# It uploads a build to TestFlight. It does not submit the app for App Store review, does not
# assign testers, and does not create App Store Connect records — the app record and the tester
# groups have to exist already, and after the upload the build has to be assigned to a group by
# hand in App Store Connect.
#
# ## What has to be in repository secrets before this can run
#
#   ASC_KEY_ID       The 10-character key id, e.g. ABCD123456.
#   ASC_ISSUER_ID    The issuer UUID from Users and Access → Integrations → Keys.
#   ASC_PRIVATE_KEY  The whole .p8 file, including the BEGIN and END lines. Apple lets you
#                    download it exactly once.
#   APPLE_TEAM_ID    Optional; falls back to the team in Config/Identifiers.xcconfig.
#
# `APP_STORE_CONNECT_*` are accepted as aliases. The first version of this workflow invented
# those longer names without checking what the repository already had, and then reported the
# credentials as missing when they had been sitting there the whole time.
#
# The key needs the App Manager role: below that, Xcode cannot create the signing certificate and
# profiles it needs, and the archive step fails on provisioning rather than on anything you wrote.
#
# There is deliberately no certificate or provisioning-profile secret. `-allowProvisioningUpdates`
# with the same API key lets Xcode issue and download what it needs, which is three secrets to
# rotate instead of five, and no .p12 sitting in a repository setting.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number. Leave blank to use the run number.'
        required: false
        type: string

env:
  XCODE_SCHEME: OffRentLedger
  XCODE_PROJECT: OffRentLedger.xcodeproj
  BUNDLE_ID: com.idlery.offrent

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    # `macos-latest` rather than a pinned image label: the labels change, and a label the
    # account does not have is a job that never starts. Pin one here if you need a specific
    # Xcode that only a newer image carries.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Fail here rather than twenty minutes in on a signing error that says nothing useful.
      - name: Check the credentials are present
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All three App Store Connect secrets are set."

      - name: Select the newest installed Xcode
        # Not a hardcoded path. Runner images gain and lose Xcode versions, and a missing
        # `/Applications/Xcode_<version>.app` fails the job on the first line with an error about
        # a directory rather than about the build.
        run: |
          set -e
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -switch "$NEWEST"
          fi
          echo "Using $(xcode-select -p)"
          xcodebuild -version

      - name: Install Python dependencies
        # `--break-system-packages` is needed on a PEP 668 Python and rejected by older pips, so
        # try it only if the plain install refuses.
        run: |
          python3 -m pip install --quiet pillow pyyaml pyjwt cryptography requests \
            || python3 -m pip install --quiet --break-system-packages \
                 pillow pyyaml pyjwt cryptography requests

      - name: Repository invariants
        run: python3 scripts/verify_repository.py

      - name: Portable domain tests
        run: swift test --package-path .

      # Xcode looks for the key here by id; `altool` looks in the same place. One file, both uses.
      - name: Install the App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      # Every upload needs a build number App Store Connect has not seen for this version — and,
      # less obviously, one *higher* than every number it already has.
      #
      # `github.run_number` was doing the first job and not the second. It is monotonic per
      # workflow, not per app, and this app's builds did not all come from this workflow: an
      # earlier Codemagic pipeline had already uploaded build 16 before GitHub Actions started
      # counting at 1. Apple accepted builds 4 through 10 because they were unique, and TestFlight
      # then sorted 16 to the top and left every tester looking at four-day-old code as though it
      # were the latest. A build nobody installs is the same as a build that never uploaded.
      #
      # So the number comes from App Store Connect itself: the highest it holds for this bundle,
      # plus one. Self-correcting, no magic offset, and it cannot be wrong-footed again by a build
      # from some other pipeline.
      - name: Set the build number
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          REQUESTED: ${{ inputs.build_number }}
        run: |
          set -e
          if [ -n "$REQUESTED" ]; then
            echo "Building $REQUESTED (asked for explicitly)"
            echo "BUILD_NUMBER=$REQUESTED" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, sys, time
          import jwt, requests

          key_id = os.environ["KEY_ID"].strip()
          issuer = os.environ["ISSUER_ID"].strip()
          bundle = os.environ["BUNDLE_ID"].strip()
          fallback = int(os.environ["GITHUB_RUN_NUMBER"])

          with open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")) as f:
              private_key = f.read()

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 1200,
               "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          session = requests.Session()
          session.headers["Authorization"] = f"Bearer {token}"
          base = "https://api.appstoreconnect.apple.com/v1"

          def highest():
              apps = session.get(f"{base}/apps", params={"filter[bundleId]": bundle},
                                 timeout=30).json().get("data", [])
              if not apps:
                  return None
              builds = session.get(
                  f"{base}/builds",
                  params={"filter[app]": apps[0]["id"], "sort": "-version", "limit": "200"},
                  timeout=30,
              ).json().get("data", [])
              numbers = []
              for build in builds:
                  raw = (build.get("attributes") or {}).get("version")
                  try:
                      numbers.append(int(str(raw).strip()))
                  except (TypeError, ValueError):
                      # A build numbered like "1.0.3" is not ours to reason about; skip it rather
                      # than crash the release on somebody else's numbering scheme.
                      continue
              return max(numbers) if numbers else None

          try:
              top = highest()
          except Exception as error:
              print(f"# App Store Connect lookup failed: {error}", file=sys.stderr)
              top = None

          if top is None:
              # Never block the release on this. The run number is still unique-per-workflow, and a
              # collision fails loudly at upload rather than silently shipping the wrong thing.
              print(f"# Falling back to the run number", file=sys.stderr)
              chosen = fallback
          else:
              chosen = max(top + 1, fallback)
              print(f"# App Store Connect's highest is {top}", file=sys.stderr)

          print(f"# Building {chosen}", file=sys.stderr)
          print(f"BUILD_NUMBER={chosen}")
          PY

      # Archive unsigned; sign at export.
      #
      # Archiving with automatic signing made Xcode go looking for an **iOS App Development**
      # profile and fail with "your team has no devices from which to generate a provisioning
      # profile" — a runner is not a registered device and never will be. Development signing is
      # not what a TestFlight build needs anyway. `-exportArchive` below applies App Store
      # distribution signing, and the API key lets it create and download those profiles itself.
      - name: Archive
        run: |
          set -o pipefail
          STATUS=0
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OffRentLedger.xcarchive" \
            OFFRENT_BUILD_NUMBER="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh archive.log
          exit $STATUS

      - name: Export the IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          # `app-store-connect` is the current name for what used to be `app-store`. It exports a
          # store-signed IPA and uploads nothing; the upload is the next step, on purpose, so a
          # failed upload can be retried without rebuilding.
          # Written with PlistBuddy rather than a heredoc. A heredoc inside a YAML block scalar
          # needs its terminator at column zero, and column zero ends the block — so the file
          # would silently never close.
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          echo "PLIST=$PLIST" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Clear dict" "$PLIST" 2>/dev/null || echo '{}' > "$PLIST"
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :destination string export" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID || '7GNFT94A9L' }}" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$PLIST"
          cat "$PLIST"
          STATUS=0
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OffRentLedger.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log || STATUS=$?
          bash scripts/ci/summarize_test_log.sh export.log
          ls -la "$RUNNER_TEMP/export" || true
          exit $STATUS

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA was exported; nothing to upload."
            exit 1
          fi
          echo "Uploading $(basename "$IPA")"

          # `altool` is deprecated and has been disappearing from newer toolchains. When it is
          # gone, re-export the same archive with `destination = upload`, which is xcodebuild's
          # own uploader and takes the same authentication. Either path uploads; neither submits.
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID"
          else
            echo "altool is not in this toolchain; uploading with xcodebuild instead."
            /usr/libexec/PlistBuddy -c "Set :destination upload" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :destination string upload" "$PLIST"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/OffRentLedger.xcarchive" \
              -exportOptionsPlist "$PLIST" \
              -exportPath "$RUNNER_TEMP/upload" \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID"
          fi

          echo
          echo "Uploaded. Apple processes the build before it appears in TestFlight — usually a"
          echo "few minutes, sometimes longer. Assign it to a tester group in App Store Connect;"
          echo "this workflow deliberately does not."

      - name: Upload logs and the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # `github.run_number`, not the BUILD_NUMBER set mid-job: when an early step fails,
          # that variable is still empty and the artifact is named `testflight-`.
          name: testflight-${{ github.run_number }}
          path: |
            *.log
            ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: ignore
