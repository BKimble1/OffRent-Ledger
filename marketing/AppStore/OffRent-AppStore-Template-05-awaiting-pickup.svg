<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796" role="img" aria-label="OffRent Ledger App Store template 5">
  <title>OffRent Ledger — App Store template 5 — awaiting-pickup</title>
  <defs>
    <!--
      The device shadow is drawn, not filtered.

      `feDropShadow` is silently ignored by cairosvg: a probe of a 50%-opacity drop shadow over a
      known background came back with the background luminance unchanged at every sample point.
      So the shadows in every previous version of these templates never rendered at all — which
      is exactly why the devices looked flat, and why turning the opacity down would not have
      helped. `feGaussianBlur` + `feOffset` renders, but with a hard edge where the falloff
      should be.

      Two radial gradients per device instead: a tight contact pool under the bottom edge and a
      wide ambient one behind. Both render exactly, and both survive an editor that drops filters
      on import — which Canva does.
    -->
    <radialGradient id="deviceShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2A22" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2E2A22" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E2A22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="16%" r="76%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E8"/>
      <stop offset="52%" stop-color="#F6F1E8"/>
      <stop offset="100%" stop-color="#E9E5DC"/>
    </linearGradient>
    <linearGradient id="topLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#FFFDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divisionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#E9E5DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neutralLift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="graphiteFade" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0%" stop-color="#171A1F"/>
      <stop offset="100%" stop-color="#252A31"/>
    </linearGradient>
    <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9E5DC"/>
      <stop offset="100%" stop-color="#F6F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1290" height="2796" fill="#D7CEBD"/>
  <path d="M 1290 0 L 1290 2796 L 129 2796 Z" fill="#CFC5B0" opacity="0.85"/>
  <rect width="1290" height="2796" fill="url(#topLift)"/>
  <g class="motif-staged"><rect x="104.0" y="2452.0" width="108.0" height="76.0" rx="21.3" fill="none" stroke="#B0A796" stroke-width="7.0"/><rect x="242.0" y="2452.0" width="108.0" height="76.0" rx="21.3" fill="none" stroke="#B0A796" stroke-width="7.0"/><rect x="380.0" y="2452.0" width="108.0" height="76.0" rx="21.3" fill="#FF8A1F"/><path d="M 523.4 2467.2 L 577.4 2490.0 L 523.4 2512.8" fill="none" stroke="#FF8A1F" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="device-shadow"><ellipse cx="1007.0" cy="1863.2" rx="571.8" ry="861.6" fill="url(#deviceShadow)" opacity="0.09"/><ellipse cx="1007.0" cy="2506.3" rx="344.5" ry="61.5" fill="url(#deviceShadow)" opacity="0.10"/></g>
  <g class="device">
    <rect x="640.47" y="940.00" width="733.06" height="1538.59"
          rx="102.95" fill="#1E1D1B"/>
    <rect x="641.97" y="941.50"
          width="730.06" height="1535.59"
          rx="101.45" fill="none" stroke="#52504A" stroke-width="3"/>
    <rect class="screen-area" x="662.00" y="961.53"
          width="690.00" height="1495.53"
          rx="81.42" fill="#D8D2C7"/>
    <rect x="906.71" y="979.10" width="200.58" height="58.83"
          rx="29.42" fill="#0B0E12"/>
  </g>
  <text x="104.0" y="440.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="112" fill="#171A1F" text-anchor="start" letter-spacing="-2.46" xml:space="preserve"><tspan x="104.0" dy="0.0">Track equipment</tspan><tspan x="104.0" dy="118.7">awaiting pickup.</tspan></text>
  <text x="104.0" y="707.0" font-family="Inter, 'Inter Display', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="52" fill="#413E38" text-anchor="start" letter-spacing="-0.21" xml:space="preserve"><tspan x="104.0" dy="0.0">Keep off-rented machines</tspan><tspan x="104.0" dy="70.7">visible until they leave.</tspan></text>
</svg>
